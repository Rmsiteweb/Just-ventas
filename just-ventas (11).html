<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1a3c5e">
  <title>Just — Gestión de Ventas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body { background: #f4f1ed; font-family: Georgia, serif; }
    #root { min-height: 100vh; }
    @keyframes fadeIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
    @keyframes loginIn { from{opacity:0;transform:translateY(20px)} to{opacity:1;transform:translateY(0)} }
    input[type=number]::-webkit-inner-spin-button { opacity:1; }
    ::-webkit-scrollbar { width:5px; height:5px; }
    ::-webkit-scrollbar-track { background:#f0ebe4; }
    ::-webkit-scrollbar-thumb { background:#b5a48a; border-radius:3px; }
    #login-screen {
      position:fixed; inset:0; z-index:99999;
      background:linear-gradient(135deg,#1a3c5e 0%,#2c5f8a 50%,#1a3c5e 100%);
      display:flex; align-items:center; justify-content:center; font-family:Georgia,serif;
    }
    #login-box {
      background:#fff; border-radius:20px; padding:48px 40px;
      width:100%; max-width:380px; text-align:center;
      box-shadow:0 24px 60px rgba(0,0,0,0.3); animation:loginIn .4s ease;
    }
    #login-box .logo { font-size:52px; margin-bottom:8px; }
    #login-box h1 { font-family:Georgia,serif; font-size:26px; font-weight:700; color:#1a3c5e; margin-bottom:4px; letter-spacing:-0.02em; }
    #login-box .subtitle { font-family:sans-serif; font-size:12px; color:#8a9ab0; letter-spacing:0.1em; text-transform:uppercase; margin-bottom:32px; }
    #login-box input {
      width:100%; padding:13px 16px; border:2px solid #dde4ee; border-radius:10px;
      font-family:sans-serif; font-size:15px; color:#1a1a2e; outline:none; margin-bottom:12px;
      transition:border-color .2s; letter-spacing:0.05em; text-align:center;
    }
    #login-box input:focus { border-color:#2c5f8a; }
    #login-box input.error { border-color:#e05252; background:#fff5f5; }
    #login-btn {
      width:100%; padding:13px; border:none; border-radius:10px;
      background:linear-gradient(135deg,#1a3c5e,#2c5f8a); color:#fff;
      font-family:sans-serif; font-weight:700; font-size:15px; cursor:pointer;
      letter-spacing:0.05em; transition:opacity .2s;
    }
    #login-btn:hover { opacity:0.9; }
    #login-error { display:none; color:#e05252; font-family:sans-serif; font-size:13px; margin-top:10px; }
    #login-box .footer-note { font-family:sans-serif; font-size:11px; color:#bbb; margin-top:24px; }
  </style>
</head>
<body>
  <div id="login-screen">
    <div id="login-box">
      <div class="logo">🌿</div>
      <h1>Just Ventas</h1>
      <div class="subtitle">Gestión de Ventas · Período 03 · 2026</div>
      <input type="password" id="pwd-input" placeholder="Ingresá tu contraseña"
        autocomplete="current-password" autocapitalize="none" spellcheck="false"/>
      <button id="login-btn" onclick="checkPassword()">Ingresar</button>
      <div id="login-error">❌ Contraseña incorrecta</div>
      <div class="footer-note">Acceso restringido</div>
    </div>
  </div>
  <div id="root">
    <div style="display:flex;align-items:center;justify-content:center;min-height:100vh;flex-direction:column;gap:16px;color:#1a3c5e;">
      <div style="font-size:48px">🌿</div>
      <div style="font-family:Georgia,serif;font-size:22px;font-weight:700">Just Ventas</div>
      <div style="font-family:sans-serif;font-size:13px;color:#888">Cargando...</div>
    </div>
  </div>

    const HASH = "b62a4c26ca1334abec8749b55625368bee623f6bae369a1c1d4b4f9696daf543";
    const SESSION_KEY = "just_auth_v1";
    async function sha256(str) {
      const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(str));
      return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,"0")).join("");
    }
    async function checkPassword() {
      const pwd = document.getElementById("pwd-input").value;
      const input = document.getElementById("pwd-input");
      const err = document.getElementById("login-error");
      if (!pwd) return;
      const hash = await sha256(pwd);
      if (hash === HASH) {
        sessionStorage.setItem(SESSION_KEY, "ok");
        document.getElementById("login-screen").style.display = "none";
        input.classList.remove("error"); err.style.display = "none";
      } else {
        input.classList.add("error"); err.style.display = "block";
        input.value = ""; input.focus();
        setTimeout(()=>input.classList.remove("error"), 1500);
      }
    }
    document.addEventListener("DOMContentLoaded", () => {
      const input = document.getElementById("pwd-input");
      input.addEventListener("keydown", e => { if(e.key==="Enter") checkPassword(); });
      input.focus();
      if (sessionStorage.getItem(SESSION_KEY) === "ok") {
        document.getElementById("login-screen").style.display = "none";
      }
    });
  </script>
</body>
</html>
